<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#010817">
<title>ATHWA</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#F6F2EE; --panel:#FFFDFC; --panel2:#F1EAD9; --border:#E6DFCC;
  --text:#171B23; --muted:#6B6459; --accent:#C6A174; --accent2:#010817;
  --good:#3F7D5B; --warn:#C97A2B; --danger:#9E3B3B;
  --gold-text:#8A642F; --warn-text:#7A4B00; --warn-bg:#FFF1D0;
  --radius:16px;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--text);
  font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
  -webkit-font-smoothing:antialiased;
}
html[dir="rtl"] body{font-family:'Segoe UI',Tahoma,'Cairo',sans-serif;}
button{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#D9C79C;border-radius:8px;}

/* ---------- App shell ---------- */
#app{display:none; height:100%; width:100%;}
#app.active{display:flex; flex-direction:column;}
#staff-app{display:none; height:100%; width:100%;}
#staff-app.active{display:flex; flex-direction:column;}

.topbar{
  display:flex; align-items:center; justify-content:space-between;
  padding:10px 20px; background:var(--panel); border-bottom:1px solid var(--border);
  position:sticky; top:0; z-index:20; box-shadow:0 2px 10px rgba(1,8,23,.04);
}
.brand{display:flex; align-items:center; gap:10px; font-weight:700; font-size:19px; font-family:Georgia,'Times New Roman',serif; letter-spacing:.5px;}
.brand .logo{
  height:52px; width:auto;
  display:flex; align-items:center; justify-content:center;
}
.brand .logo img{height:100%; width:auto; object-fit:contain; display:block;}
.topbar-right{display:flex; align-items:center; gap:10px;}
.icon-btn{
  width:38px; height:38px; border-radius:50%; border:1px solid var(--border);
  background:var(--panel2); color:var(--text); display:flex; align-items:center; justify-content:center;
  cursor:pointer; position:relative;
}
.icon-btn:hover{background:#E9DEC4;}
.badge{position:absolute; top:-4px; inset-inline-end:-4px; background:var(--danger); color:#fff; font-size:10px; border-radius:10px; padding:1px 5px; font-weight:700;}
.lang-toggle{
  border:1px solid var(--border); background:var(--panel2); color:var(--text);
  border-radius:20px; padding:8px 14px; cursor:pointer; font-size:13px; font-weight:600;
}

.body-wrap{display:flex; flex:1; min-height:0;}

.sidenav{
  width:230px; background:var(--panel); border-inline-end:1px solid var(--border);
  padding:16px 10px; overflow-y:auto;
}
.nav-item{
  display:flex; align-items:center; gap:12px; padding:11px 12px; border-radius:12px;
  color:var(--muted); cursor:pointer; margin-bottom:4px; font-size:14px; font-weight:600;
  transition:.15s;
}
.nav-item svg{width:19px; height:19px; flex-shrink:0;}
.nav-item:hover{background:var(--panel2); color:var(--text);}
.nav-item.active{background:rgba(198,161,116,.14); color:var(--accent2); border:1px solid rgba(198,161,116,.4);}

main{flex:1; overflow-y:auto; padding:22px; min-width:0;}

.bottomnav{display:none;}

/* ---------- Cards / commons ---------- */
.card{background:var(--panel); border:1px solid var(--border); border-radius:var(--radius); padding:18px; box-shadow:0 1px 2px rgba(1,8,23,.04), 0 6px 16px rgba(1,8,23,.05);}
.ic-sm{display:inline-flex; vertical-align:-4px; margin-inline-end:6px; color:var(--accent2); opacity:.75;}
.ic-sm svg{width:16px; height:16px; display:block;}
.grid{display:grid; gap:14px;}
.grid-4{grid-template-columns:repeat(4,1fr);}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-2{grid-template-columns:repeat(2,1fr);}
.dept-grid{display:grid; grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); gap:10px;}
.dept-check{display:flex; align-items:center; gap:8px; padding:10px 12px; border-radius:10px; background:var(--panel2); font-size:13.5px; overflow:hidden;}
.dept-check input{flex-shrink:0;}
.dept-check span{flex:1 1 auto; min-width:0; overflow-wrap:break-word;}
@media(max-width:980px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

h1.page-title{font-size:22px; margin:0 0 4px; font-family:Georgia,'Times New Roman',serif; font-weight:700;}
p.page-sub{color:var(--muted); margin:0 0 20px; font-size:14px;}

.tile{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:18px 14px; text-align:center; cursor:pointer; transition:.15s;
  box-shadow:0 1px 2px rgba(1,8,23,.04), 0 4px 10px rgba(1,8,23,.04);
}
.tile:hover{transform:translateY(-3px); border-color:var(--accent); box-shadow:0 10px 22px rgba(1,8,23,.09);}
.tile .ic{
  width:46px; height:46px; margin:0 auto 10px; border-radius:12px;
  background:rgba(198,161,116,.14); display:flex; align-items:center; justify-content:center; color:var(--accent2);
}
.tile .ic svg{width:22px; height:22px;}
.tile-label{font-size:13px; font-weight:600;}

.btn{
  border:none; border-radius:12px; padding:12px 18px; font-weight:700; cursor:pointer; font-size:14px;
  background:var(--accent2); color:#fff; transition:.15s;
}
.btn:hover{filter:brightness(1.25);}
.btn.secondary{background:var(--panel2); color:var(--text); border:1px solid var(--border);}
.btn.ghost{background:transparent; color:var(--accent2); border:1px solid var(--accent2);}
.btn.sm{padding:8px 12px; font-size:12.5px;}
.btn.full{width:100%;}
.btn:disabled{opacity:.5; cursor:not-allowed;}

input,select,textarea{
  width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
  border-radius:10px; padding:11px 12px; font-size:14px; outline:none;
}
input:focus,select:focus,textarea:focus{border-color:var(--accent); box-shadow:0 0 0 3px rgba(198,161,116,.22);}
label{font-size:12.5px; color:var(--muted); font-weight:600; margin-bottom:6px; display:block;}
.field{margin-bottom:14px;}

.row{display:flex; gap:10px; align-items:center;}
.between{justify-content:space-between;}
.wrap{flex-wrap:wrap;}

.pill{
  display:inline-flex; align-items:center; gap:6px; padding:4px 10px; border-radius:20px;
  font-size:11.5px; font-weight:700; background:rgba(63,125,91,.14); color:var(--good);
}
.pill.warn{background:var(--warn-bg); color:var(--warn-text);}
.pill.danger{background:rgba(158,59,59,.14); color:var(--danger);}
.pill.info{background:rgba(198,161,116,.16); color:var(--accent2);}

.list-item{
  display:flex; align-items:center; justify-content:space-between; padding:13px 4px;
  border-bottom:1px solid var(--border);
}
.list-item:last-child{border-bottom:none;}

/* ---------- Admin console (platform_admin): KPI cards, data tables, search, breadcrumb ---------- */
.kpi-card{
  background:var(--panel); border:1px solid var(--border); border-radius:var(--radius);
  padding:16px; display:flex; align-items:flex-start; gap:12px;
  box-shadow:0 1px 2px rgba(1,8,23,.04), 0 6px 16px rgba(1,8,23,.05);
}
.kpi-card .kpi-ic{
  width:38px; height:38px; min-width:38px; border-radius:10px;
  background:rgba(198,161,116,.14); display:flex; align-items:center; justify-content:center; color:var(--accent2);
}
.kpi-card .kpi-ic svg{width:19px; height:19px;}
.kpi-card .kpi-label{color:var(--muted); font-size:12px; margin-bottom:4px;}
.kpi-card .kpi-value{font-size:24px; font-weight:700; line-height:1.1;}

.breadcrumb{display:flex; align-items:center; gap:6px; font-size:12.5px; color:var(--muted); margin-bottom:10px; flex-wrap:wrap;}
.breadcrumb a, .breadcrumb span.bc-link{color:var(--accent2); cursor:pointer; font-weight:600;}
.breadcrumb a:hover, .breadcrumb span.bc-link:hover{text-decoration:underline;}
.breadcrumb .bc-sep{opacity:.6;}

.search-bar{position:relative; margin-bottom:12px;}
.search-bar input{padding-inline-start:36px;}
.search-bar .search-ic{position:absolute; inset-inline-start:11px; top:50%; transform:translateY(-50%); color:var(--muted); pointer-events:none;}
.search-bar .search-ic svg{width:16px; height:16px; display:block;}

.dtable-wrap{overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--panel);}
table.dtable{width:100%; border-collapse:collapse; font-size:13.5px; white-space:nowrap;}
table.dtable thead th{
  position:sticky; top:0; background:var(--panel2); color:var(--muted); font-weight:700;
  text-align:start; padding:10px 14px; font-size:11.5px; text-transform:uppercase; letter-spacing:.03em;
  border-bottom:1px solid var(--border);
}
table.dtable tbody td{padding:11px 14px; border-bottom:1px solid var(--border); vertical-align:middle;}
table.dtable tbody tr:last-child td{border-bottom:none;}
table.dtable tbody tr:hover{background:var(--panel2);}
table.dtable td.num{font-variant-numeric:tabular-nums;}
table.dtable td.actions{white-space:nowrap;}
.dtable-empty{padding:24px; text-align:center; color:var(--muted);}

.chart-card .chart-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.chart-card .chart-row:last-child{margin-bottom:0;}
.chart-card .chart-label{width:110px; min-width:110px; font-size:12.5px; color:var(--muted);}
.chart-card .chart-track{flex:1; background:var(--panel2); border-radius:8px; height:16px; overflow:hidden;}
.chart-card .chart-fill{height:100%; border-radius:8px;}
.chart-card .chart-value{width:40px; min-width:40px; text-align:end; font-size:12.5px; font-weight:700; font-variant-numeric:tabular-nums;}

.toast-wrap{position:fixed; bottom:20px; inset-inline-end:20px; z-index:999; display:flex; flex-direction:column; gap:10px;}
.toast{
  background:var(--panel); border:1px solid var(--accent); color:var(--text); padding:12px 16px;
  border-radius:12px; box-shadow:0 10px 26px rgba(1,8,23,.14); font-size:13.5px; min-width:220px;
  animation:slidein .25s ease;
}
@keyframes slidein{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);}}

.screen{display:none;}
.screen.active{display:block; animation:fade .2s ease;}
@keyframes fade{from{opacity:0;} to{opacity:1;}}

/* ---------- Login screen ---------- */
#login-screen{
  height:100%; display:flex; align-items:center; justify-content:center; padding:20px; position:relative;
  background:radial-gradient(900px 500px at 25% 0%, rgba(198,161,116,.16), transparent 60%), var(--accent2);
}
.login-card{width:100%; max-width:380px; background:var(--panel); border:1px solid var(--border); border-radius:20px; padding:36px 30px; text-align:center; transition:max-width .15s; box-shadow:0 2px 4px rgba(1,8,23,.05), 0 20px 44px rgba(1,8,23,.10);}
.portal-tile{
  background:var(--panel2); border:1px solid var(--border); border-radius:14px; padding:18px 12px;
  text-align:center; cursor:pointer; transition:.15s;
}
.portal-tile:hover{border-color:var(--accent); transform:translateY(-2px);}
.portal-tile .ic{width:44px; height:44px; margin:0 auto 8px; border-radius:12px; background:rgba(198,161,116,.14); display:flex; align-items:center; justify-content:center; color:var(--accent2);}
.portal-tile .ic svg{width:22px; height:22px;}
.login-logo{height:96px; width:auto; display:flex; align-items:center; justify-content:center; margin:0 auto 14px;}
.login-logo img{height:100%; width:auto; object-fit:contain; display:block;}

/* menu / order */
.menu-cat-tabs{display:flex; gap:8px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px;}
.menu-cat-tabs button{
  white-space:nowrap; padding:9px 16px; border-radius:20px; border:1px solid var(--border);
  background:var(--panel2); color:var(--muted); cursor:pointer; font-weight:600; font-size:13px;
}
.menu-cat-tabs button.active{background:var(--accent2); color:#fff; border-color:var(--accent2);}
.menu-item{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:14px; display:flex; flex-direction:column; gap:8px; box-shadow:0 1px 2px rgba(1,8,23,.04), 0 4px 10px rgba(1,8,23,.04);}
.menu-item .name{font-weight:700; font-size:14.5px;}
.menu-item .desc{font-size:12px; color:var(--muted); min-height:30px;}
.menu-item .price{color:var(--accent2); font-weight:800;}

.cart-fab{
  position:fixed; bottom:24px; inset-inline-start:50%; transform:translateX(-50%);
  background:var(--accent2); color:#fff; padding:13px 26px; border-radius:30px; font-weight:700;
  box-shadow:0 10px 26px rgba(1,8,23,.35); cursor:pointer; display:none; align-items:center; gap:8px;
  z-index:30;
}
html[dir=rtl] .cart-fab{transform:translateX(50%);}

.chat-wrap{display:flex; flex-direction:column; height:calc(100vh - 200px); max-height:560px;}
.chat-log{flex:1; overflow-y:auto; padding:10px; display:flex; flex-direction:column; gap:10px;}
.msg{max-width:70%; padding:10px 14px; border-radius:14px; font-size:13.5px; line-height:1.5;}
.msg.guest{align-self:flex-end; background:var(--accent2); color:#fff; border-bottom-right-radius:4px;}
html[dir=rtl] .msg.guest{align-self:flex-start; border-bottom-right-radius:14px; border-bottom-left-radius:4px;}
.msg.staff{align-self:flex-start; background:var(--panel2); border:1px solid var(--border); border-bottom-left-radius:4px;}
html[dir=rtl] .msg.staff{align-self:flex-end; border-bottom-left-radius:14px; border-bottom-right-radius:4px;}
.chat-input{display:flex; gap:8px; padding:10px; border-top:1px solid var(--border);}

.rating-stars{font-size:30px; letter-spacing:6px; cursor:pointer; color:#E1D3B0;}
.rating-stars span.active{color:var(--gold-text);}

.stepper{display:flex; align-items:center; gap:10px;}
.stepper button{width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--panel2); color:var(--text); font-weight:800; cursor:pointer;}

.slider{width:100%;}

.color-dot{width:26px; height:26px; border-radius:50%; cursor:pointer; border:2px solid transparent;}
.color-dot.active{border-color:var(--accent2);}

.hidden{display:none !important;}

.banner{
  display:flex; align-items:center; justify-content:space-between; gap:14px;
  background:linear-gradient(90deg, rgba(198,161,116,.14), rgba(198,161,116,.04));
  border:1px solid rgba(198,161,116,.35); border-radius:var(--radius); padding:16px 18px; margin-bottom:20px;
}

footer.legal{color:var(--muted); font-size:11.5px; text-align:center; padding:16px 0 4px;}

@media(max-width:860px){
  .sidenav{display:none;}
  main{padding-bottom:90px;}
  .bottomnav{
    display:flex; position:fixed; bottom:0; inset-inline-start:0; inset-inline-end:0; z-index:25;
    background:var(--panel); border-top:1px solid var(--border); padding:6px 4px;
    overflow-x:auto;
  }
  .bottomnav .nav-item{flex-direction:column; gap:3px; font-size:10px; padding:8px 10px; min-width:64px; text-align:center; margin:0;}
  .bottomnav .nav-item svg{width:20px; height:20px;}
}

/* ---------- Brand refresh: logo mark, accessibility, motion ---------- */
.brand-lockup{height:34px; width:auto; display:block;}
.login-lockup{height:78px; width:auto; display:block; margin:0 auto 14px;}
.brand-tagline{font-size:12px; color:var(--muted); letter-spacing:.3px; margin:0 0 18px;}
:focus-visible{outline:2px solid var(--gold-text); outline-offset:2px; border-radius:6px;}
@media(max-width:860px){
  .icon-btn{width:44px; height:44px;}
}
@media(prefers-reduced-motion: reduce){
  *{animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; scroll-behavior:auto !important;}
}
</style>
</head>
<body>

<!-- ================= LOGIN / PORTAL ================= -->
<div id="login-screen">
  <button class="lang-toggle" style="position:absolute; top:20px; inset-inline-end:20px;" onclick="toggleLang()"><span id="lang-label-login">English</span></button>
  <div class="login-card" id="login-card"></div>
</div>

<!-- ================= GUEST APP ================= -->
<div id="app">
  <div class="topbar">
    <div class="brand"><img src="assets/athwa-lockup-light-bg.svg" alt="ATHWA" class="brand-lockup"></div>
    <div class="topbar-right">
      <button class="lang-toggle" onclick="toggleLang()"><span id="lang-label">English</span></button>
      <button class="icon-btn" onclick="nav('messages')" title="Messages">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M21 15a2 2 0 0 1-2 2H8l-5 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg><span class="badge" id="msg-badge">1</span>
      </button>
      <button class="icon-btn" onclick="nav('dashboard')" title="Notifications">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M6 8a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M9.5 18a2.5 2.5 0 0 0 5 0"/></svg><span class="badge" id="notif-badge">2</span>
      </button>
      <button class="icon-btn" onclick="doLogout()" title="Logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </div>

  <div class="body-wrap">
    <nav class="sidenav" id="sidenav"></nav>

    <main id="main"></main>
  </div>

  <nav class="bottomnav" id="bottomnav"></nav>
</div>


<!-- ================= STAFF APP ================= -->
<div id="staff-app">
  <div class="topbar">
    <div class="brand"><img src="assets/athwa-lockup-light-bg.svg" alt="ATHWA" class="brand-lockup"> <span style="font-size:12px; color:var(--muted); font-family:inherit;" id="staff-role-label"></span></div>
    <div class="topbar-right">
      <button class="lang-toggle" onclick="toggleLang()"><span id="lang-label-staff">English</span></button>
      <button class="icon-btn" onclick="staffLogout()" title="Logout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </div>
  </div>

  <div class="body-wrap">
    <nav class="sidenav" id="staff-sidenav"></nav>

    <main id="staff-main"></main>
  </div>

  <nav class="bottomnav" id="staff-bottomnav"></nav>
</div>

<div class="toast-wrap" id="toast-wrap"></div>

<script>
window.ATHWA_ENTRY = 'unified';

/* ---------------- ATHWA live backend client ---------------- */
// The same 6 HTML files are deployed unchanged to both the staging static
// site and the production static site (that's the whole point - byte-
// identical files, so what's tested on staging is exactly what ships). That
// means API_BASE can't be a single hardcoded URL: it has to resolve to
// whichever backend belongs to the environment this page is actually being
// served from, or staging silently talks to production (or gets blocked by
// production's stricter CORS/CSP, which is what surfaced this).
const API_BASE = (function(){
  const map = {
    'athwa-app-staging.onrender.com': 'https://athwa-backend-staging.onrender.com',
    'athwa-app-utex.onrender.com': 'https://athwa-backend-943m.onrender.com',
  };
  return map[location.hostname] || 'https://athwa-backend-943m.onrender.com';
})();
const HOTEL_SLUG = new URLSearchParams(location.search).get('hotel') || 'zahret-alsharq';
function getGuestToken(){ return localStorage.getItem('athwa_guest_token'); }
function setGuestToken(tok){ if(tok) localStorage.setItem('athwa_guest_token', tok); else localStorage.removeItem('athwa_guest_token'); }
function getStaffToken(){ return localStorage.getItem('athwa_staff_token'); }
function setStaffToken(tok){ if(tok) localStorage.setItem('athwa_staff_token', tok); else localStorage.removeItem('athwa_staff_token'); }
async function apiCall(path, opts){
  opts = opts || {};
  const headers = {'Content-Type':'application/json'};
  if(opts.token) headers['Authorization'] = 'Bearer '+opts.token;
  let res;
  try{
    res = await fetch(API_BASE+path, {method: opts.method||'GET', headers, body: opts.body?JSON.stringify(opts.body):undefined});
  }catch(e){
    throw new Error(LANG==='ar'?'تعذر الاتصال بالسيرفر':'Could not reach the server');
  }
  let data = null;
  try{ data = await res.json(); }catch(e){}
  if(!res.ok){ const err = new Error((data&&data.error)||'Request failed'); err.status=res.status; err.data=data; throw err; }
  return data;
}
const FRONT_TO_BACK_STATUS = {pending:'pending', progress:'in_progress', done:'completed'};
const BACK_TO_FRONT_STATUS = {pending:'pending', acknowledged:'pending', in_progress:'progress', completed:'done', cancelled:'done'};
function mapBackendRequest(r){
  return {
    id:r.id, dept:r.department, status:BACK_TO_FRONT_STATUS[r.status]||r.status,
    titleAr:r.request_type||'', titleEn:r.request_type||'',
    guestName:r.guest_name||'Guest', room:r.room_number||'-',
    staffAr:'', staffEn:'', time:r.created_at,
    slaStatus:r.slaStatus||null, // 'on_time' | 'at_risk' | 'overdue' | null (closed requests)
  };
}
function mapBackendFeedback(f){
  return {name:f.guest_name||'Guest', room:f.room_number||'-', rating:f.rating||0, commentAr:f.comment||'', commentEn:f.comment||''};
}
function mapBackendPrearrival(p){
  return {name:p.guest_name||'Guest', room:p.room_number||'-', arrivalTime:p.arrival_time||'', flightNo:(p.preferences&&p.preferences.flightNo)||'',

function loadHotelsFilters(){
  try{
    const raw = localStorage.getItem('athwa_hotels_filters');
    if(!raw) return;
    const f = JSON.parse(raw);
    if(f.status) ADMIN_HOTELS_FILTER_STATUS = f.status;
    if(f.plan) ADMIN_HOTELS_FILTER_PLAN = f.plan;
    if(f.billing) ADMIN_HOTELS_FILTER_BILLING = f.billing;
    if(f.sortBy) ADMIN_HOTELS_SORT_BY = f.sortBy;
    if(f.sortDir) ADMIN_HOTELS_SORT_DIR = f.sortDir;
  }catch(e){ /* corrupt/old saved filter shape - ignore, defaults stand */ }
}
function saveHotelsFilters(){
  try{
    localStorage.setItem('athwa_hotels_filters', JSON.stringify({
      status: ADMIN_HOTELS_FILTER_STATUS, plan: ADMIN_HOTELS_FILTER_PLAN, billing: ADMIN_HOTELS_FILTER_BILLING,
      sortBy: ADMIN_HOTELS_SORT_BY, sortDir: ADMIN_HOTELS_SORT_DIR,
    }));
  }catch(e){ /* private browsing / storage disabled - filters just won't persist */ }
}
function setHotelsFilter(kind, val){
  if(kind==='status') ADMIN_HOTELS_FILTER_STATUS = val;

function setHotelsSortBy(col){

// Applies the current filter/sort selection to the already-fetched, real
// ADMIN_HOTELS list. This runs client-side over the full dataset rather than
// via server pagination - at this platform's current scale that's simpler
// and just as real (no data is invented or hidden), and it composes cleanly
// with the existing free-text search box's client-side row filtering.
function getFilteredSortedHotels(){
  let list = ADMIN_HOTELS.slice();
  if(ADMIN_HOTELS_FILTER_STATUS==='active') list = list.filter(h=>h.active && !h.archived_at);
  else if(ADMIN_HOTELS_FILTER_STATUS==='inactive') list = list.filter(h=>!h.active && !h.archived_at);
  if(ADMIN_HOTELS_FILTER_PLAN!=='all') list = list.filter(h=>(h.plan||'essential')===ADMIN_HOTELS_FILTER_PLAN);
  if(ADMIN_HOTELS_FILTER_BILLING!=='all') list = list.filter(h=>(h.billing_status||'active')===ADMIN_HOTELS_FILTER_BILLING);
  const dir = ADMIN_HOTELS_SORT_DIR==='asc' ? 1 : -1;
  const key = ADMIN_HOTELS_SORT_BY;
  list.sort((a,b)=>{
    let av, bv;
    if(key==='name'){ av=(a.name||'').toLowerCase(); bv=(b.name||'').toLowerCase(); }
    else if(key==='plan'){ av=a.plan||'essential'; bv=b.plan||'essential'; }
    else if(key==='billing_status'){ av=a.billing_status||'active'; bv=b.billing_status||'active'; }
    else { av=a.created_at||''; bv=b.created_at||''; }
    if(av<bv) return -1*dir;
    if(av>bv) return 1*dir;
    return 0;
  });
  return list;
}

  const token = getStaffToken();
  const body = action==='archive' ? {archived:true} : {active: action==='activate'};

// Lazy per-tab fetch for the four hotel-scoped drill-down endpoints plus the
// hotel-filtered audit log. No-ops if already loaded for this hotel, or if
// the tab doesn't need a dedicated fetch (overview/staff/alerts reuse
// already-fetched platform-wide data, filtered client-side).
async function loadHotelProfileTabData(tab){
  const h = ADMIN_HOTELS.find(x=>x.id===ADMIN_SETTINGS_HOTEL_ID);
  if(!h) return;
  const token = getStaffToken();
  const key = tab==='audit' ? 'auditLog' : tab==='billing' ? 'invoices' : tab==='recovery' ? 'recoveryCases' : tab;
  if(!['guests','requests','feedback','facilities','audit','billing','gxi','recovery','revenue'].includes(tab)) return;
  if(ADMIN_HOTEL_PROFILE_DATA[key] !== null) return;
  try{
    const apiSegment = tab==='recovery' ? 'recovery-cases' : key;
    const path = tab==='audit' ? `/api/admin/audit-log?hotelId=${h.id}&limit=100` : `/api/admin/hotels/${h.id}/${apiSegment}`;
    ADMIN_HOTEL_PROFILE_DATA[key] = await apiCall(path, {token}) || [];
    if(STAFF_CURRENT==='hotel-settings' && ADMIN_HOTEL_PROFILE_TAB===tab) staffRender();
  }catch(e){ ADMIN_HOTEL_PROFILE_DATA[key] = []; /* empty state rather than an infinite loading spinner */ }
}

let ADMIN_SEARCH_DEBOUNCE = null;
function onAdminGlobalSearchInput(val){
  ADMIN_SEARCH_QUERY = val;
  clearTimeout(ADMIN_SEARCH_DEBOUNCE);
  ADMIN_SEARCH_DEBOUNCE = setTimeout(async ()=>{
    if(!val || val.trim().length < 2){ ADMIN_SEARCH_RESULTS = null; staffRenderSearchResultsOnly(); return; }
    try{
      const token = getStaffToken();
      ADMIN_SEARCH_RESULTS = await apiCall('/api/admin/search?q='+encodeURIComponent(val.trim()), {token});
    }catch(e){ ADMIN_SEARCH_RESULTS = {hotels:[], users:[], guests:[]}; }
    staffRenderSearchResultsOnly();
  }, 300);
}
// Re-renders just the search page (not the whole staffRender path) so typing
// doesn't fight with input focus - full staffRender() would blow away the
// input element's cursor position on every keystroke.
function staffRenderSearchResultsOnly(){
  const el = document.getElementById('admin-search-results');
  if(el) el.innerHTML = renderAdminSearchResults();
}
async function refreshOpsData(){
  try{
    // platform_admin has no hotel scope - it manages hotels platform-wide, not
    // a single hotel's requests/feedback/prearrivals (those endpoints are
    // 403'd for this role server-side), so poll whichever admin section is
    // currently on screen instead.
    if(S.staff.loggedIn && getStaffToken() && S.staff.role==='platform_admin'){
      if(STAFF_CURRENT==='dashboard'){ await refreshAdminDashboard(); await refreshAdminAlerts(); }
      else if(STAFF_CURRENT==='analytics') await refreshAdminAnalytics();
      else if(STAFF_CURRENT==='users') await refreshAdminUsers();
      else if(STAFF_CURRENT==='audit') await refreshAdminAuditLog();
      else if(STAFF_CURRENT==='alerts') await refreshAdminAlerts();
      else if(STAFF_CURRENT==='settings') { await refreshPlatformSettings(); await refreshPlatformAdmins(); }
      else if(STAFF_CURRENT==='search') { /* no background poll - results only refresh on input */ }
      else await refreshAdminHotels();
    } else if(S.staff.loggedIn && getStaffToken()){
      const token = getStaffToken();
      const [reqs, fb, pre] = await Promise.all([
        apiCall('/api/requests', {token}),
        (S.staff.role!=='dept') ? apiCall('/api/feedback', {token}) : Promise.resolve([]),
        (S.staff.role!=='dept') ? apiCall('/api/prearrival', {token}) : Promise.resolve([]),
      ]);
      CACHE.requests = reqs.map(mapBackendRequest);
      CACHE.feedback = fb.map(mapBackendFeedback);
      CACHE.prearrivals = pre.map(mapBackendPrearrival);
      staffRender();
    } else if(S.loggedIn && getGuestToken()){
      const token = getGuestToken();
      const reqs = await apiCall('/api/requests/mine', {token});
      CACHE.requests = reqs.map(mapBackendRequest);
      // Keep the Offers tab fresh while the guest is looking at it (e.g. a
      // staff member deactivates an offer mid-visit) - not fetched otherwise
      // to avoid an unnecessary call on every 6s poll for guests elsewhere in
      // the app.
      if(CURRENT==='offers') GUEST_OFFERS = await apiCall('/api/offers', {token}).catch(()=>GUEST_OFFERS);
      render();
    }
  }catch(e){ /* silent: keep last known cache on transient network errors */ }
}
function startLivePolling(){
  if(REFRESH_TIMER) clearInterval(REFRESH_TIMER);
  refreshOpsData();
  REFRESH_TIMER = setInterval(refreshOpsData, 6000);
}

let LANG = localStorage.getItem('karam_lang') || 'ar';
function t(key){ return (DICT[LANG] && DICT[LANG][key]) || key; }
// Maps a raw DB role ('owner'|'manager'|'dept_manager'|'staff'|'platform_admin')
// to its display label. dept_manager/staff share the 'role_dept' label since
// the DICT only distinguishes owner/manager/department-level/platform roles.
function roleLabel(role){
  if(role==='dept_manager' || role==='staff') return t('role_dept');
  return escapeHtml(t('role_'+role));
}

function applyLang(){
  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === 'ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = t(el.getAttribute('data-i18n'));
  });
  const lbl = LANG === 'ar' ? 'English' : 'العربية';
  const a = document.getElementById('lang-label'); if(a) a.textContent = lbl;
  const b = document.getElementById('lang-label-login'); if(b) b.textContent = lbl;
  const c = document.getElementById('lang-label-staff'); if(c) c.textContent = lbl;
  const guestShell = document.getElementById('app');
  const staffShell = document.getElementById('staff-app');
  if(!S.loggedIn && !S.staff.loggedIn) renderLogin();
  if(S.loggedIn && guestShell){ buildNav(); render(); }
  if(S.staff.loggedIn && staffShell){ buildStaffNav(); staffRender(); updateStaffRoleLabel(); }
}
function toggleLang(){
  LANG = LANG === 'ar' ? 'en' : 'ar';
  localStorage.setItem('karam_lang', LANG);

  if(str===null || str===undefined) return '';
  return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function toast(msg){
  const wrap = document.getElementById('toast-wrap');

/* ---------------- Auth (unified login: one identifier + password field for everyone) ---------------- */
async function unifiedLogin(btn){
  const identifier = document.getElementById('login-id').value.trim();
  const password = document.getElementById('login-pass').value.trim();
  if(!identifier || !password){ toast(LANG==='ar'?'من فضلك أدخل بيانات الدخول':'Please enter your login details'); return; }
  const origText = btn ? btn.textContent : null;
  let slowTimer = null;
  if(btn){
    btn.disabled = true;
    btn.textContent = LANG==='ar' ? 'جارٍ الدخول...' : 'Signing in...';
    slowTimer = setTimeout(()=>{ btn.textContent = LANG==='ar' ? 'جارٍ تشغيل السيرفر، قد يستغرق دقيقة...' : 'Waking up the server, may take a minute...'; }, 4000);
  }
  let res;
  try{
    res = await apiCall('/api/auth/login', {method:'POST', body:{slug:HOTEL_SLUG, identifier, password}});
  }catch(e){
    toast(LANG==='ar'?'بيانات الدخول غير صحيحة':'Invalid login credentials');
    if(slowTimer) clearTimeout(slowTimer);
    if(btn){ btn.disabled = false; btn.textContent = origText; }
    return;
  }
  if(slowTimer) clearTimeout(slowTimer);

  if(res.type === 'guest'){
    setGuestToken(res.token);
    S.guest = {name: res.guest.name, room: res.guest.room, hotelName: res.guest.hotelName||'', enabledDepartments: res.guest.enabledDepartments || ALL_DEPARTMENTS};
    S.loggedIn = true;
    saveState();
    document.getElementById('login-screen').style.display='none';
    document.getElementById('app').classList.add('active');
    buildNav();
    let hasPrearrival = false;
    try{
      const pre = await apiCall('/api/prearrival/mine', {token: res.token});
      hasPrearrival = !!pre;
      if(pre){ S.preArrival.submitted = true; saveState(); }
    }catch(e){}
    startLivePolling();
    nav(hasPrearrival ? 'dashboard' : 'prearrival');
  } else {
    setStaffToken(res.token);
    // backend role names: owner, manager, dept_manager, staff -> frontend uses 'dept' for dept_manager/staff
    const backendRole = res.user.role;
    const frontRole = (backendRole==='dept_manager'||backendRole==='staff') ? 'dept' : backendRole;
    S.staff = {
      loggedIn:true, role:frontRole, dept:res.user.department||null, name:res.user.name,
      enabledDepartments: res.user.enabledDepartments || ALL_DEPARTMENTS,
    };
    saveState();
    document.getElementById('login-screen').style.display='none';
    document.getElementById('staff-app').classList.add('active');
    updateStaffRoleLabel();
    buildStaffNav();
    staffNav(defaultStaffPage(frontRole));
    startLivePolling();
  }
}
function doLogout(){
  S.loggedIn = false; saveState();
  setGuestToken(null);
  if(REFRESH_TIMER){ clearInterval(REFRESH_TIMER); REFRESH_TIMER=null; }
  toast(t('logged_out'));
  document.getElementById('app').classList.remove('active');
  renderLogin();
  document.getElementById('login-screen').style.display='flex';
}

  const items = NAV_ITEMS.filter(key => !ALL_DEPARTMENTS.includes(key) || !enabled || enabled.includes(key));

/* ---------------- Actions ---------------- */
function requestsList(dept){
  const items = CACHE.requests.filter(r=>r.dept===dept);
  if(items.length===0) return '';
  return `<div class="card" style="margin-top:18px;">
    <strong style="display:block; margin-bottom:10px;">${LANG==='ar'?'طلباتي':'My Requests'}</strong>
    ${items.map(r=>`<div class="list-item"><span>${escapeHtml(opsTitle(r))}</span><span class="pill ${r.status==='done'?'':'warn'}">${r.status==='done'?t('status_done'):t('status_pending')}</span></div>`).join('')}
  </div>`;
}
async function pushRequest(dept, title){
  try{
    await apiCall('/api/requests', {method:'POST', token:getGuestToken(), body:{department:dept, requestType:title}});
    toast(t('request_sent'));
    await refreshOpsData();
    render();
  }catch(e){
    toast(LANG==='ar'?'تعذر إرسال الطلب، حاول مرة أخرى':'Could not send the request, please try again');
  }
}
function quickRequest(dept, title){ pushRequest(dept, title); }
function customRequest(dept, textareaId){
  const el = document.getElementById(textareaId);
  const val = el.value.trim();
  if(!val){ toast(LANG==='ar'?'اكتب طلبك أولاً':'Please type your request'); return; }
  el.value='';
  pushRequest(dept, val);
}
function submitMaintenance(){
  const cat = document.getElementById('mt-cat').value;
  const urgency = document.getElementById('mt-urgency').value;
  const desc = document.getElementById('mt-desc').value.trim() || t(cat);
  pushRequest('maintenance', `${t(cat)} · ${urgency==='urgent'?t('urgent'):t('normal')} · ${desc}`);
  document.getElementById('mt-desc').value='';
}
async function submitPreArrival(){
  const draft = {
    submitted:true,
    arrivalTime: document.getElementById('pa-time').value,
    flightNo: document.getElementById('pa-flight').value.trim(),
    pillow: document.getElementById('pa-pillow').value,
    temp: document.getElementById('pa-temp').value,
    floor: document.getElementById('pa-floor').value,
    occasion: document.getElementById('pa-occasion').value,
    earlyCheckin: document.getElementById('pa-early').checked,
    notes: document.getElementById('pa-notes').value.trim(),
  };
  try{
    await apiCall('/api/prearrival', {method:'POST', token:getGuestToken(), body:{
      arrivalTime: draft.arrivalTime, floorPref: draft.floor, tempPref: draft.temp, roomPrepNotes: draft.notes,
      preferences: {flightNo:draft.flightNo, pillow:draft.pillow, occasion:draft.occasion, earlyCheckin:draft.earlyCheckin},
    }});
    S.preArrival = draft;
    saveState();
    toast(t('prearrival_saved'));
    render();
  }catch(e){
    toast(LANG==='ar'?'تعذر حفظ بيانات ما قبل الوصول':'Could not save pre-arrival info');
  }
}
function scheduleCleaning(){
  const time = document.getElementById('hk-time').value;
  pushRequest('housekeeping', (LANG==='ar'?'تنظيف الساعة ':'Cleaning at ')+time);
}
function submitLaundry(){
  const items = document.getElementById('ld-items').value.trim() || (LANG==='ar'?'غسيل عام':'General laundry');
  const speed = document.querySelector('input[name="ld-speed"]:checked').value;
  const time = document.getElementById('ld-time').value;
  pushRequest('laundry', `${items} · ${speed==='express'?t('express'):t('normal')} · ${time}`);
  const amount = speed==='express'?60:35;
  S.bill.push({label:(LANG==='ar'?'مغسلة - ':'Laundry - ')+items, amount});
  saveState();
}
function bookSpa(name, time){
  pushRequest('spa', `${name} · ${time}`);
}
function bookTaxi(){
  const dest = document.getElementById('tx-dest').value.trim() || (LANG==='ar'?'وجهة غير محددة':'Unspecified');
  const time = document.getElementById('tx-time').value;
  const car = document.getElementById('tx-car').value;
  pushRequest('taxi', `${dest} · ${car} · ${time}`);
}
function setColor(c){ S.roomCtrl.color=c; saveState(); render(); }
function setCurtain(v){ S.roomCtrl.curtains=v; saveState(); render(); }

function addToCart(id, cat){
  const item = MENU[cat].find(i=>i.id===id);
  const existing = S.cart.find(c=>c.id===id);
  if(existing) existing.qty++;
  else S.cart.push({id, cat, qty:1});
  saveState();
  toast(`${item.name[LANG]} ${t('add')} ✓`);
  render();
}
function openCart(){
  const html = `
    <div style="position:fixed; inset:0; background:rgba(1,8,23,.45); z-index:60; display:flex; align-items:flex-end; justify-content:center;" onclick="if(event.target===this) this.remove();">
      <div class="card" style="width:100%; max-width:480px; border-radius:20px 20px 0 0; max-height:70vh; overflow-y:auto;">
        <h3 style="margin-top:0;">${t('cart')}</h3>
        ${S.cart.length===0? `<p style="color:var(--muted)">${t('empty_cart')}</p>` :
          S.cart.map(c=>{
            const item = MENU[c.cat].find(i=>i.id===c.id);
            return `<div class="list-item"><span>${item.name[LANG]} × ${c.qty}</span><strong>${item.price*c.qty} SAR</strong></div>`;
          }).join('')}
        ${S.cart.length>0?`<div class="row between" style="margin-top:14px; font-size:16px;"><strong>${t('total')}</strong><strong style="color:var(--accent2)">${cartTotal()} SAR</strong></div>
        <button class="btn full" style="margin-top:14px;" onclick="placeOrder(); this.closest('div[style*=fixed]').remove();">${t('place_order')}</button>`:''}
      </div>
    </div>`;
  document.body.insertAdjacentHTML('beforeend', html);
}
function cartTotal(){
  return S.cart.reduce((sum,c)=>{ const item = MENU[c.cat].find(i=>i.id===c.id); return sum + item.price*c.qty; },0);
}
function placeOrder(){
  if(S.cart.length===0) return;
  const total = cartTotal();
  S.bill.push({label:(LANG==='ar'?'طلب مطعم':'Restaurant order'), amount: total});
  S.orders.push({items:[...S.cart], total, time:new Date().toISOString()});
  S.cart = [];

function sendMessage(){
  const el = document.getElementById('chat-in');
  const val = el.value.trim();
  if(!val) return;
  S.messages.push({from:'guest', text:val});
  el.value='';
  saveState();
  render();
  const thinkingMsg = {from:'staff', text:{ar:'... يفكر', en:'... thinking'}};
  S.messages.push(thinkingMsg);
  if(CURRENT==='messages') render();
  apiCall('/api/concierge/ask', {method:'POST', token:getGuestToken(), body:{question:val, lang:LANG}})
    .then(res=>{
      const i = S.messages.indexOf(thinkingMsg);
      if(i!==-1) S.messages.splice(i,1);
      S.messages.push({from:'staff', text:'🤖 '+res.answer});
      saveState();
      if(CURRENT==='messages') render();
    })
    .catch(()=>{
      const i = S.messages.indexOf(thinkingMsg);
      if(i!==-1) S.messages.splice(i,1);
      S.messages.push({from:'staff', text:{ar:'تعذر الوصول للمساعد الذكي الآن، سيتم تحويل رسالتك للاستقبال.', en:'Could not reach the AI assistant right now, your message will be routed to the front desk.'}});
      saveState();
      if(CURRENT==='messages') render();
    });
}

async function submitResetPassword(token, btn){
  const p1 = document.getElementById('rp-pass1').value;
  const p2 = document.getElementById('rp-pass2').value;
  if(p1.length < 8){ toast(t('password_too_short')); return; }
  if(p1 !== p2){ toast(t('passwords_dont_match')); return; }
  const origText = btn.textContent; btn.disabled = true;
  try{
    await apiCall('/api/auth/reset-password', {method:'POST', body:{token, newPassword:p1}});
    toast(t('password_reset_success'));
    // Drop ?reset=... from the URL so a page refresh doesn't re-show this
    // form with an already-consumed (now-invalid) token.
    const url = new URL(location.href); url.searchParams.delete('reset');
    history.replaceState({}, '', url.toString());
    renderLogin();
  }catch(e){
    toast(e.message || t('reset_link_invalid'));
  }finally{
    btn.disabled = false; btn.textContent = origText;
  }
}

// Generic client-side table-row filter: hides <tr data-search="..."> rows that
// don't contain the query (case-insensitive). Used by every admin data table.
function filterTableRows(inputVal, tbodyId){
  const q = (inputVal||'').trim().toLowerCase();
  const tbody = document.getElementById(tbodyId);
  if(!tbody) return;
  let anyVisible = false;
  Array.from(tbody.querySelectorAll('tr[data-search]')).forEach(tr=>{

// Client-side CSV export - no backend round-trip, no library. `rows` is an
// array of plain objects; `columns` is [[header, key-or-fn], ...]. Downloads
// via a Blob + temporary <a download> (works fully offline, no server call).
function csvEscape(v){
  let s = v===null || v===undefined ? '' : String(v);
  // CSV/formula-injection guard: a cell starting with =, +, -, @ (or a tab/CR)
  // can be interpreted as a formula by Excel/Sheets/LibreOffice when the file
  // is opened, which is a real attack vector for exported data that includes
  // user-entered text (hotel names, notes, etc). Prefixing with a single
  // quote neutralizes it in every spreadsheet app while leaving the visible
  // value unchanged.
  if(/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  return /[",\n]/.test(s) ? '"'+s.replace(/"/g,'""')+'"' : s;
}
function exportCSV(filename, columns, rows){
  const header = columns.map(c=>csvEscape(c[0])).join(',');
  const body = rows.map(r=>columns.map(c=>csvEscape(typeof c[1]==='function' ? c[1](r) : r[c[1]])).join(',')).join('\n');
  const csv = '﻿' + header + '\n' + body;
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// Aggregates a {date,count} daily series into ISO-week (Mon-start) buckets
// once there are more than 14 points, so a 90-day period renders ~13 bars
// instead of ~90 unreadable ones. Left as daily for 7d/30d.
function bucketGrowthForChart(entries){
  if(!entries || entries.length===0) return [];
  if(entries.length<=14) return entries;
  const weekMap = {};
  entries.forEach(e=>{
    const d = new Date(e.date+'T00:00:00Z');
    const dow = (d.getUTCDay()+6)%7; // 0=Monday
    const weekStart = new Date(d); weekStart.setUTCDate(d.getUTCDate()-dow);
    const key = weekStart.toISOString().slice(0,10);
    weekMap[key] = (weekMap[key]||0) + e.count;
  });
  return Object.entries(weekMap).map(([date,count])=>({date,count})).sort((a,b)=>a.date<b.date?-1:1);
}
function formatShortDate(iso){
  const d = new Date(iso+'T00:00:00Z');
  return d.toLocaleDateString(LANG==='ar'?'ar-SA':'en-US', {month:'short', day:'numeric'});
}

  if(el) el.style.display = el.style.display==='none' ? 'block' : 'none';
}
async function submitAddInvoice(hotelId, btn){
  const amountRaw = hpVal('hs-inv-amount');
  const amount = Number(amountRaw);
  if(!amountRaw || Number.isNaN(amount) || amount<=0){ toast(t('invoice_amount_required')); return; }
  const origText = btn.textContent; btn.disabled = true;
  try{
    const token = getStaffToken();
    await apiCall(`/api/admin/hotels/${hotelId}/invoices`, {method:'POST', token, body:{
      amount, dueDate: hpVal('hs-inv-due')||undefined, notes: hpVal('hs-inv-notes')||undefined,
    }});
    ADMIN_HOTEL_PROFILE_DATA.invoices = null; // force refetch
    await loadHotelProfileTabData('billing');
    toast(t('hotel_updated_ok'));
  }catch(e){
    toast(e.message || (LANG==='ar'?'فشلت العملية':'Action failed'));
  }finally{
    btn.disabled = false; btn.textContent = origText;
  }
}
async function setInvoiceStatus(hotelId, invoiceId, status){
  try{
    const token = getStaffToken();
    await apiCall(`/api/admin/hotels/${hotelId}/invoices/${invoiceId}`, {method:'PATCH', token, body:{status}});
    ADMIN_HOTEL_PROFILE_DATA.invoices = null;
    await loadHotelProfileTabData('billing');
    toast(t('hotel_updated_ok'));
  }catch(e){
    toast(e.message || (LANG==='ar'?'فشلت العملية':'Action failed'));
  }
}

  const data = ADMIN_HOTEL_PROFILE_DATA.gxi;
  if(data===null) return `<div class="card"><p style="color:var(--muted)">${t('loading_label')}</p></div>`;
  const score = data.score;
  const color = score===null ? 'var(--muted)' : score>=70 ? 'var(--ok, #1a9c5c)' : score>=40 ? 'var(--warn, #c68a1a)' : 'var(--danger, #c62828)';

  switch(ADMIN_HOTEL_PROFILE_TAB){
    case 'identity': return hpIdentityTab(h);

    case 'billing': return hpBillingTab(h);
    case 'gxi': return hpGxiTab(h);
    case 'recovery': return hpRecoveryTab(h);
    case 'revenue': return hpRevenueTab(h);
    case 'integration': return hpIntegrationTab(h);
    case 'staff': return hpStaffTab(h);
    case 'guests': return hpGuestsTab(h);
    case 'requests': return hpRequestsTab(h);
    case 'feedback': return hpFeedbackTab(h);
    case 'facilities': return hpFacilitiesTab(h);
    case 'audit': return hpAuditTab(h);
    case 'alerts': return hpAlertsTab(h);
    case 'links': return hpLinksTab(h);
    case 'danger': return hpDangerTab(h);
    default: return hpOverviewTab(h);
  }
}

  overview(){
    const all = getAllOpsRequests();
    const pending = all.filter(r=>r.status==='pending').length;
    const progress = all.filter(r=>r.status==='progress').length;

    const fb = getAllFeedback();
    const avgRating = fb.length ? (fb.reduce((a,b)=>a+b.rating,0)/fb.length).toFixed(1) : '-';
    const kpis = [
      {label:t('kpi_occupied'), value:'—'},
      {label:t('kpi_pending'), value:pending},
      {label:t('kpi_progress'), value:progress},
      {label:t('kpi_done_today'), value:done},

  hotels(){
    // KPI cards always reflect the FULL fetched dataset, not the active
    // filters - a platform_admin filtering the table to "overdue" shouldn't
    // see "Total hotels: 2" and think 2 is the whole platform.
    const fullList = ADMIN_HOTELS;
    const activeCount = fullList.filter(h=>h.active && !h.archived_at).length;
    const inactiveCount = fullList.filter(h=>!h.active && !h.archived_at).length;
    const list = getFilteredSortedHotels();

                <td>${escapeHtml(r.room_number||'-')}</td>
                <td>${escapeHtml(r.offer_name)}</td>

                  ${r.status==='pending' ? `
                    <button class="btn sm" onclick="setRedemptionStatus(${Number(r.id)},'confirmed')">${t('confirm_action')}</button>

  },  performance(){

      return `${pageHead(t('staff_nav_performance'))}<div class="card"><p style="color:var(--muted)">${t('loading_label')}</p></div>`;
    }
    const {gxi, billing, revenue} = STAFF_PERFORMANCE;
    const score = gxi ? gxi.score : null;
    const scoreColor = score===null||score===undefined ? 'var(--muted)' : score>=70 ? 'var(--ok, #1a9c5c)' : score>=40 ? 'var(--warn, #c68a1a)' : 'var(--danger, #c62828)';

    return `

      <div class="card" style="text-align:center;padding:28px;margin-bottom:22px;">
        ${score===null||score===undefined
          ? `<div class="muted">${t('gxi_no_reviews')}</div>`

      <h3 style="margin:0 0 10px;">${t('billing_section')}</h3>

        <table class="dtable">
          <thead><tr><th>${t('invoice_amount')}</th><th>${t('invoice_due_date')}</th><th>${t('invoice_status')}</th><th>${t('invoice_notes')}</th></tr></thead>

      </div>
      <h3 style="margin:0 0 10px;">${t('revenue_total_label')}</h3>
      <div class="card" style="text-align:center; padding:24px; margin-bottom:18px;">
        <div style="font-size:40px; font-weight:800; color:var(--accent2); line-height:1;">${Number((revenue&&revenue.totalRevenue)||0)} SAR</div>
        <div class="muted" style="margin-top:6px;">${t('revenue_total_label')} · ${t('revenue_confirmed_count')}: ${(revenue&&revenue.confirmedCount)||0}</div>
      </div>
      ${redemptions.length===0 ? `<div class="card"><p style="color:var(--muted)">${t('offers_no_redemptions')}</p></div>` : `
      <div class="dtable-wrap">
        <table class="dtable">
          <thead><tr><th>${t('col_room')}</th><th>${t('col_name')}</th><th>${t('offers_price')}</th><th>${t('col_status')}</th></tr></thead>
          <tbody>
            ${redemptions.map(r=>`
              <tr>
                <td>${escapeHtml(r.room_number||'-')}</td>
                <td>${escapeHtml(r.offer_name)}</td>
                <td>${Number(r.price)} ${escapeHtml(r.currency||'SAR')}</td>
                <td><span class="pill ${r.status==='pending'?'warn':r.status==='cancelled'?'danger':''}">${escapeHtml(t('redemption_status_'+r.status))}</span></td>
              </tr>`).join('')}
          </tbody>
        </table>

    `;
  },

  alerts(){
    const list = ADMIN_ALERTS;
    const counts = {danger:0, warn:0, info:0};
    list.forEach(a=>{ if(counts[a.severity]!==undefined) counts[a.severity]++; });
    const sevIcon = {danger: ICONS_ADMIN.bolt, warn: STAFF_ICONS.alerts, info: ICONS_ADMIN.clockKpi};
    return `
      ${pageHead(t('staff_nav_alerts'), `${escapeHtml(S.staff.name)} · ${escapeHtml(t('role_'+S.staff.role))}`)}
      <div class="grid grid-3" style="margin-bottom:20px;">
        ${kpiCard(ICONS_ADMIN.bolt, t('alerts_critical_kpi'), counts.danger)}
        ${kpiCard(STAFF_ICONS.alerts, t('alerts_warning_kpi'), counts.warn)}
        ${kpiCard(ICONS_ADMIN.clockKpi, t('alerts_info_kpi'), counts.info)}
      </div>
      ${list.length===0?`<div class="card"><p style="color:var(--muted)">${t('no_alerts')}</p></div>`:
      list.map(a=>`
        <div class="card" style="margin-bottom:10px; display:flex; align-items:flex-start; gap:12px;">
          <div class="kpi-ic" style="background:${a.severity==='danger'?'rgba(158,59,59,.14)':a.severity==='warn'?'rgba(201,122,43,.14)':'rgba(198,161,116,.14)'}; color:${a.severity==='danger'?'var(--danger)':a.severity==='warn'?'var(--warn)':'var(--accent2)'};">${sevIcon[a.severity]||''}</div>
          <div style="flex:1;">
            <div class="row between">
              <strong>${escapeHtml(t('alert_'+a.type))}</strong>
              <span class="pill ${a.severity==='danger'?'danger':a.severity==='warn'?'warn':'info'}">${a.severity}</span>
            </div>
            <div style="color:var(--muted); font-size:13px; margin-top:4px;">
              ${a.hotelName ? escapeHtml(a.hotelName) : (LANG==='ar'?'منصّة عامة':'Platform-wide')}
              ${a.meta && a.meta.count!==undefined ? ' · ' + a.meta.count : ''}
              ${a.meta && a.meta.avgRating!==undefined ? ' · ' + a.meta.avgRating + ' ★' : ''}
              ${a.meta && a.meta.billingNextDue ? ' · ' + new Date(a.meta.billingNextDue).toLocaleDateString() : ''}
            </div>
          </div>
          ${a.hotelId ? `<button class="btn sm secondary" onclick="openHotelSettings(${a.hotelId})">${t('hotel_settings')}</button>` : ''}
        </div>`).join('')}
    `;
  },
  search(){
    return `
      ${pageHead(t('staff_nav_search'), `${escapeHtml(S.staff.name)} · ${escapeHtml(t('role_'+S.staff.role))}`)}
      ${searchBar('admin-global-search-input', t('search_placeholder_global'), 'onAdminGlobalSearchInput(this.value)')}
      <div id="admin-search-results">${renderAdminSearchResults()}</div>
    `;
  },
  settings(){
    const s = ADMIN_PLATFORM_SETTINGS;
    const admins = ADMIN_PLATFORM_ADMINS;
    const isFull = S.staff.adminScope !== 'readonly';
    const depts = s ? (s.default_enabled_departments||[]) : ALL_DEPARTMENTS;
    return `
      ${pageHead(t('staff_nav_settings'), `${escapeHtml(S.staff.name)} · ${escapeHtml(t('role_'+S.staff.role))}`)}
      ${!isFull ? `<div class="card" style="margin-bottom:16px; border-color:var(--warn);"><span class="pill warn">${t('readonly_admin_notice')}</span></div>` : ''}
      ${!s ? `<div class="card"><p style="color:var(--muted)">${t('no_data')}</p></div>` : `
      <div class="card" style="margin-bottom:16px;">
        <strong style="display:block; margin-bottom:12px;">${t('platform_identity_section')}</strong>
        <div class="grid grid-2">
          <div class="field"><label>${t('setting_platform_name')}</label><input id="ps-platform-name" value="${escapeHtml(s.platform_name||'ATHWA')}" ${isFull?'':'disabled'}></div>
          <div class="field"><label>${t('setting_support_email')}</label><input id="ps-support-email" value="${escapeHtml(s.support_email||'')}" ${isFull?'':'disabled'}></div>
          <div class="field"><label>${t('setting_support_phone')}</label><input id="ps-support-phone" value="${escapeHtml(s.support_phone||'')}" ${isFull?'':'disabled'}></div>
        </div>
      </div>
      <div class="card" style="margin-bottom:16px;">
        <strong style="display:block; margin-bottom:12px;">${t('default_departments_section')}</strong>
        <div class="dept-grid">
          ${ALL_DEPARTMENTS.map(d=>`
            <label class="dept-check">
              <input type="checkbox" id="ps-dept-${d}" ${depts.includes(d)?'checked':''} ${isFull?'':'disabled'}>
              <span>${escapeHtml(t('nav_'+d))}</span>
            </label>
          `).join('')}
        </div>
      </div>
      ${isFull ? `<div class="row" style="gap:8px; margin-bottom:20px;"><button class="btn" onclick="submitPlatformSettings(this)">${t('save_changes')}</button></div>` : ''}
      `}
      <div class="card">
        <div class="row between" style="margin-bottom:12px;">
          <strong>${t('platform_admins_section')}</strong>
          ${isFull ? `<button class="btn sm" onclick="toggleAddPlatformAdminForm()">${t('add_platform_admin')}</button>` : ''}
        </div>
        ${ADMIN_ADD_ADMIN_OPEN ? `
        <div class="card" style="margin-bottom:14px; background:var(--panel2);">
          <div class="grid grid-2">
            <div class="field"><label>${t('new_admin_name')}</label><input id="pa-name"></div>
            <div class="field"><label>${t('new_admin_email')}</label><input id="pa-email" type="email"></div>
            <div class="field"><label>${t('new_admin_password')}</label><input id="pa-password" type="password"></div>
            <div class="field"><label>${t('new_admin_scope')}</label>
              <select id="pa-scope">
                <option value="readonly">${t('admin_scope_readonly')}</option>
                <option value="full">${t('admin_scope_full')}</option>
              </select>

          </div>
          <div class="row" style="gap:8px; margin-top:6px;">
            <button class="btn" onclick="submitAddPlatformAdmin(this)">${t('create_hotel_btn')}</button>

        <div class="dtable-wrap">
          <table class="dtable">
            <thead><tr><th>${t('col_user')}</th><th>${t('col_scope')}</th><th>${t('col_status')}</th><th></th></tr></thead>
            <tbody>
              ${admins.length===0?`<tr><td colspan="4" class="dtable-empty">${t('no_data')}</td></tr>`:
              admins.map(a=>`

                  <td class="actions">${isFull ? `<button class="btn sm secondary" onclick="toggleAdminPlatformAdminActive(${Number(a.id)}, ${!!a.active})">${a.active?t('deactivate'):t('activate')}</button> <button class="btn sm ghost" style="color:#ff6b6b;border-color:#ff6b6b;" onclick="deleteAdminPlatformAdmin(${Number(a.id)})">${t('delete_permanently')}</button>` : ''}</td>

// Renders just the results panel for the global-search page (kept separate
// from STAFF_RENDERERS.search so typing can re-render only this fragment
// without rebuilding the input element and losing cursor focus).
function renderAdminSearchResults(){
  if(!ADMIN_SEARCH_RESULTS){
    return `<p style="color:var(--muted); font-size:13px;">${t('search_type_min_chars')}</p>`;
  }
  const r = ADMIN_SEARCH_RESULTS;
  const total = (r.hotels||[]).length + (r.users||[]).length + (r.guests||[]).length;
  if(total===0) return `<p style="color:var(--muted); font-size:13px;">${t('no_search_results')}</p>`;
  let html = '';
  if(r.hotels && r.hotels.length){
    html += `<strong style="display:block; margin:10px 0 6px; font-size:13px; color:var(--muted);">${t('search_results_hotels')}</strong><div class="card" style="margin-bottom:10px;">`;
    html += r.hotels.map(h=>`<div class="list-item"><span><strong>${escapeHtml(h.name)}</strong> <span style="color:var(--muted); font-size:12px;">(${escapeHtml(h.slug)})</span></span><button class="btn sm secondary" onclick="openHotelSettings(${Number(h.id)})">${t('hotel_settings')}</button></div>`).join('');
    html += `</div>`;
  }
  if(r.users && r.users.length){
    html += `<strong style="display:block; margin:10px 0 6px; font-size:13px; color:var(--muted);">${t('search_results_users')}</strong><div class="card" style="margin-bottom:10px;">`;
    html += r.users.map(u=>`<div class="list-item"><span><strong>${escapeHtml(u.name)}</strong> <span style="color:var(--muted); font-size:12px;">${escapeHtml(u.email)} · ${escapeHtml(u.hotel_name||'')}</span></span><span class="pill">${roleLabel(u.role)}</span></div>`).join('');
    html += `</div>`;
  }
  if(r.guests && r.guests.length){
    html += `<strong style="display:block; margin:10px 0 6px; font-size:13px; color:var(--muted);">${t('search_results_guests')}</strong><div class="card">`;
    html += r.guests.map(g=>`<div class="list-item"><span><strong>${escapeHtml(g.name)}</strong> <span style="color:var(--muted); font-size:12px;">${t('room_label')} ${escapeHtml(g.room_number)} · ${escapeHtml(g.hotel_name||'')}</span></span></div>`).join('');
    html += `</div>`;
  }
  return html;
}

/* ---------------- Boot ---------------- */
function boot(){
  loadHotelsFilters();
  // a locally-remembered logged-in flag with no live token is a stale/expired session — force back to login
  if(S.loggedIn && !getGuestToken()) S.loggedIn = false;
  if(S.staff.loggedIn && !getStaffToken()) S.staff = {loggedIn:false, role:null, dept:null, name:''};
  saveState();
  const guestShell = document.getElementById('app');
  const staffShell = document.getElementById('staff-app');
  const resetToken = new URLSearchParams(location.search).get('reset');
  if(resetToken){
    // A password-reset email link always takes priority over any existing
    // logged-in session - someone following that link wants to set a new
    // password right now, not land back in a stale dashboard.
    applyLang();
    renderResetPassword(resetToken);
    return;
  }
  if(S.loggedIn && guestShell){
    document.getElementById('login-screen').style.display='none';
    guestShell.classList.add('active');
  } else if(S.staff.loggedIn && staffShell){
    document.getElementById('login-screen').style.display='none';
    staffShell.classList.add('active');
  } else {
    renderLogin();
  }
  applyLang();
  if(S.loggedIn && guestShell){ buildNav(); nav(S.preArrival.submitted ? 'dashboard' : 'prearrival'); startLivePolling(); }
  if(S.staff.loggedIn && staffShell){ updateStaffRoleLabel(); buildStaffNav(); staffNav(defaultStaffPage(S.staff.role)); startLivePolling(); }

  if('serviceWorker' in navigator){
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  }
}
boot();
</script>
